server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker + manifest keep the same filename across builds (no
    # content hash), unlike everything else under assets/. They must always
    # be revalidated or the browser (and Cloudflare's edge) can pin a user
    # to a week-old app build - vs the immutable-cached assets/*.js below,
    # which are safe to cache forever because their filename changes on
    # every build.
    location ~ ^/excalidraw/(sw\.js|service-worker\.js|manifest\.webmanifest)$ {
        alias /usr/share/nginx/html/$1;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/excalidraw/(.+\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webmanifest))$ {
        alias /usr/share/nginx/html/$1;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /excalidraw/api/ {
        proxy_pass http://excalidraw-api:80/excalidraw/api/;
        proxy_set_header Host $host;
        proxy_set_header Remote-User $http_remote_user;
    }

    location /excalidraw/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /excalidraw/index.html;
    }

    location = /excalidraw {
        return 301 /excalidraw/;
    }

    location = / {
        return 301 /excalidraw/;
    }
}
