server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/excalidraw/(.+\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webmanifest))$ {
        alias /usr/share/nginx/html/$1;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /excalidraw/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /excalidraw/index.html;
    }

    location = /excalidraw {
        return 301 /excalidraw/;
    }

    location = / {
        return 301 /excalidraw/;
    }
}
